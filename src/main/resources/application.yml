server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: store-be
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:store_be/.env[.properties]

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    driver-class-name: org.postgresql.Driver
    username: ${SUPABASE_DB_USERNAME:postgres.imtbcjdrnvjbmdxvnunh}
    password: ${SUPABASE_DB_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:https://imtbcjdrnvjbmdxvnunh.supabase.co/auth/v1}
          jwk-set-uri: ${SUPABASE_JWKS_URI:https://imtbcjdrnvjbmdxvnunh.supabase.co/auth/v1/.well-known/jwks.json}
          jws-algorithms:
            - ES256

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  firebase:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO
